repos:
  # Lints the agent context -- AGENTS.md, CLAUDE.md and the skills --
  # for malformed frontmatter, smuggled unicode and pasted secrets. The
  # Supply chain workflow runs this same hook, so this rev is the only
  # place the version is written down.
  - repo: https://github.com/stbenjam/skillsaw
    rev: v0.20.0
    hooks:
      - id: skillsaw

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        args: ['-config-file', '.github/actionlint.yaml']

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: ^(tools/|release\.sh)
        types_or: [sh, bash, shell]
        args: ['-x']

  - repo: local
    hooks:
      - id: check-log-levels
        name: check log levels
        entry: tools/check-log-levels.sh
        language: script
        pass_filenames: false
        always_run: true

      - id: tox-flake8
        name: tox flake8
        entry: tox -eflake8
        language: system
        pass_filenames: false
        always_run: true

      - id: tox-py3
        name: tox py3
        entry: tox -epy3
        language: system
        pass_filenames: false
        always_run: true
