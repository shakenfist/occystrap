# Documentation-only changes do not need an ephemeral VM. Nothing in
# this workflow reads docs/ or the markdown at the top of the tree, and
# a run here costs tens of minutes of a pool the whole fleet shares, so
# a pull request which changes only those paths skips it.
#
# A filter job rather than trigger-level paths-ignore, because "Can
# enqueue: unit" is a required status check, and so is "Can merge:
# unit" while the merge queue is enabled: a required check in a
# paths-ignore'd workflow never reports on a filtered pull request, and a required check that never reports blocks the merge
# forever, while a skipped one satisfies it. The filter only runs on
# pull requests. A push to develop, and a merge queue entry when the
# queue is enabled, always test in full, since those runs are the ones
# release.yml's CI gate counts, so a docs-only commit can be released.
#
# The content scanners in supply-chain.yml are deliberately left
# unfiltered: a credential, or an instruction smuggled into text an
# agent loads, arrives in documentation as easily as in code.

name: Sanity checks

permissions:
  contents: read

on:
  # The merge queue is disabled while occystrap#169 is open (its queue
  # never built a merge group), so pull requests merge to develop
  # directly once "Can enqueue: unit" passes, and the push run on
  # develop is the one release.yml's CI gate counts. The merge_group
  # trigger and "Can merge: unit" stay, so that turning the queue back
  # on is only a ruleset change; see "Merging" in docs/development.md.
  merge_group:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  # Detect changes touching only docs/ and markdown, so that a pull
  # request which changes nothing else skips the lint and unit tests.
  # The filter runs on pull requests only: on a push and on a merge
  # group code_changed defaults to true, so those runs always test. On
  # pull requests the base is the pull request's base branch. Unlike
  # functional-tests.yml this workflow has no workflow_dispatch
  # trigger, so a docs-only pull request cannot run this lane by hand.
  #
  # By default a file matches if it matches ANY listed pattern, which
  # makes '**' match everything and silently defeats the exclusions.
  # 'every' requires a file to match ALL patterns, which is the correct
  # semantics for an "everything except docs" filter.
  check_paths:
    name: "Check paths"
    runs-on: [self-hosted, static]
    timeout-minutes: 10
    # paths-filter reads the changed-file list from pulls.listFiles
    # rather than from the working tree, and the top-level permissions
    # block sets every scope it does not name to none.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code_changed: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
      # Make the verdict visible in the log rather than inferred from
      # which downstream jobs skipped.
      - name: Report verdict
        run: echo "code_changed=${{ steps.filter.outputs.code || 'true (defaulted)' }}"

  lint:
    needs: check_paths
    if: needs.check_paths.outputs.code_changed != 'false'
    # s (two vCPU) rather than the xs a sizeless runs-on silently falls
    # back to -- the conductor takes the size from the labels and
    # otherwise uses the first entry in its CI_SIZES table, which is one
    # vCPU and 2048 MB. This job dist-upgrades the image and then builds
    # two tox environments before it lints anything, which is why it has
    # been taking six to twelve minutes for work that is a few seconds
    # of flake8 and a small unit suite. It needs a vm rather than a
    # static runner because it installs packages.
    runs-on: [self-hosted, vm, debian-13, s]
    # On a push, key on the commit: every push to develop has the same
    # github.ref, and a group keyed on it would cancel or drop (a group
    # holds one pending run, whatever cancel-in-progress says) the run
    # release.yml's CI gate needs for an earlier commit.
    #
    # On a merge group, key on the base branch rather than github.ref,
    # which is a new queue branch on every rebuild, so a superseded run
    # is cancelled. That is safe because the queue is serial
    # (max_entries_to_build: 1): any other first attempt of a
    # merge_group run has already been abandoned. A re-run is not a
    # queue build, though. It keeps its original event, so with the
    # base-branch key a "Re-run jobs" on an old queue run would cancel
    # the live queue entry or be cancelled by it. Re-runs therefore keep
    # their own queue branch's group. The merge_group- prefix matches
    # functional-tests.yml, where it keeps a queue run out of a
    # workflow_dispatch run's group on develop; this workflow has no
    # such trigger.
    concurrency:
      group: >-
        ${{ github.workflow }}-lint-${{
        github.event_name == 'push' && format('push-{0}', github.sha)
        || github.event_name == 'merge_group' && github.run_attempt == '1'
        && format('merge_group-{0}', github.event.merge_group.base_ref)
        || github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout code with two commits
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get dist-upgrade -y
          sudo apt-get install -y -q tox python3 python3-venv python3-wheel

      - name: Lint with flake8
        run: |
          tox -eflake8

      - name: Run unit tests
        run: |
          tox -epy3

  # Two aggregator checks, collecting this workflow's jobs into one
  # result each, in the shape described at
  # https://boinkor.net/2023/11/neat-github-actions-patterns-for-github-merge-queues/
  # "Can enqueue: unit" reports on pull requests and pushes, and is what
  # the develop ruleset requires while the merge queue is disabled
  # (occystrap#169). "Can merge: unit" reports on merge queue entries,
  # and is kept for when the queue is re-enabled; each is skipped, which
  # GitHub treats as success, on the other events. On a push lint
  # always runs, since check_paths defaults code_changed to true, so the
  # skip "Can enqueue: unit" tolerates cannot arise there. The names
  # are suffixed because release.yml's CI gate counts both this
  # workflow and functional-tests.yml, and a job's needs cannot reach
  # across them: functional-tests.yml has a pair of its own, and the
  # ruleset requires both "Can enqueue" checks (and, with the queue on,
  # all four).
  #
  # "Can enqueue: unit" counts lint as passed when it was skipped,
  # which is what a pull request that changes only docs/ or markdown
  # gets. "Can merge: unit" does not: on a merge queue entry every job
  # runs, and must succeed, since this run is the one the CI gate counts.
  can-enqueue-unit:
    name: "Can enqueue: unit"
    needs:
      - check_paths
      - lint
    # always(), not !cancelled(): if the run is cancelled as a
    # whole, this must still run and fail on the cancelled needs.
    # A skipped check satisfies a required one, so a skip here
    # would let an untested commit through.
    if: ${{ always() && github.event_name != 'merge_group' }}
    # The steps read only the needs context, so the token needs nothing.
    permissions: {}
    runs-on: [self-hosted, static]
    timeout-minutes: 5
    steps:
      # Only the lint job may be skipped here, and only because
      # check_paths found nothing but docs. Any other skipped job fails.
      - name: Transform outcomes
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "ALL_SUCCESS=$(echo "${NEEDS_JSON}" | jq 'to_entries | map(.value.result == "success" or (.key == "lint" and .value.result == "skipped")) | all')" >> "${GITHUB_ENV}"
      - name: Check outcomes
        run: |
          [ "${ALL_SUCCESS}" == true ]

  can-merge-unit:
    name: "Can merge: unit"
    needs:
      - check_paths
      - lint
    # always(), not !cancelled(): if the run is cancelled as a
    # whole, this must still run and fail on the cancelled needs.
    # A skipped check satisfies a required one, so a skip here
    # would let an untested commit through.
    if: ${{ always() && github.event_name == 'merge_group' }}
    # The steps read only the needs context, so the token needs nothing.
    permissions: {}
    runs-on: [self-hosted, static]
    timeout-minutes: 5
    steps:
      # Every need must succeed: on a merge queue entry every job is
      # meant to run, and this run is the one release.yml's CI gate
      # counts. A job that skipped here would let an untested tier
      # reach a release.
      - name: Transform outcomes
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "ALL_SUCCESS=$(echo "${NEEDS_JSON}" | jq '. | to_entries | map(.value.result == "success") | all')" >> "${GITHUB_ENV}"
      - name: Check outcomes
        run: |
          [ "${ALL_SUCCESS}" == true ]
