# Fix test failures with Claude Code
#
# SECURITY CONSIDERATIONS:
# This workflow can be triggered in two ways:
#
# 1. workflow_dispatch (manual): Safe - only users with write access
#    can trigger
# 2. workflow_call (from pr-fix-tests.yml): Requires careful
#    consideration
#
# When called from issue_comment-triggered workflows:
# - Code from the PR is checked out and tests are executed
# - This intentionally runs untrusted code in a privileged context
# - Security is enforced by:
#   a) Authorization check in the calling workflow (pr-fix-tests.yml)
#      Only repository maintainers can trigger via
#      shakenfist/actions/pr-bot-trigger
#   b) Self-hosted runners provide isolation from production systems
#   c) GITHUB_TOKEN scope is limited to this repository
#   d) The job runs on the shared claude-code pool, which is
#      pre-provisioned and long-lived rather than a throwaway VM, so
#      the hooks setting below is made repository-local rather than
#      --global, and scratch files are written to runner.temp. The
#      bot commit identity is the exception: it is set --global, as
#      it is in every other workflow in the fleet, and does outlive
#      the job on the pool
#
# Risk acceptance: The benefit of automated test fixes outweighs the
# risk because only trusted maintainers can trigger execution.
#
# See: https://securitylab.github.com/research/github-actions-preventing-pwn-requests/
#
# - Scratch files (prompts, logs, captured output) live in
#   runner.temp, never the workspace: the workspace is the repo
#   checkout, and anything written there is swept into the commit by
#   "git add -A" and counted against the size cap.
#
# Template source: shakenfist/development/templates/test-drift-fix/,
# customised for occystrap where the template asks for it: the
# dependency install, the test command and the Claude prompt. The rest
# is the template's and is kept diffable against it.

name: Fix test failures with Claude Code

# audit-ok: merge-group-cancellation -- this workflow is reusable, but
# its only caller is pr-fix-tests.yml on issue_comment, so it can never
# run under a merge_group event and has no queue entry to supersede.

on:
  workflow_dispatch:
    inputs:
      max_turns:
        description: 'Maximum Claude turns'
        required: false
        default: '200'
        type: string
      dry_run:
        description: 'Dry run (test only, no commits)'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      ref:
        description: 'Branch to checkout (for PR-triggered runs)'
        required: false
        type: string
      pr_number:
        description: 'PR number (for PR-triggered runs)'
        required: false
        type: string
      max_turns:
        description: 'Maximum Claude turns'
        required: false
        default: '50'
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  test-and-fix:
    runs-on: [self-hosted, claude-code]
    timeout-minutes: 120
    concurrency:
      group: ${{ github.workflow }}-${{ inputs.pr_number || github.ref }}
      cancel-in-progress: true

    env:
      IS_PR_RUN: ${{ inputs.pr_number != '' }}
      PR_NUMBER: ${{ inputs.pr_number }}
      PR_REF: ${{ inputs.ref }}

    steps:
      - name: Set environment variables
        run: |
          {
            echo "DATESTAMP=$(date '+%Y%m%d')"
            echo "DATEPRETTY=$(date '+%-d %B %Y')"
          } >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --global user.name "shakenfist-bot"
          git config --global user.email "bot@shakenfist.com"
          # The checkout above may be a pull request's head branch, and
          # the steps below run the project's tests and Claude Code over
          # it. Hooks are not tracked in a checkout, so this is defence
          # in depth -- but the security model claims the control for
          # these workflows, so it is set rather than merely documented.
          # Repository-local, not --global: this job runs on the shared
          # claude-code pool, and a global setting would change state
          # every other repository's jobs on that machine inherit. See
          # https://github.com/shakenfist/development/blob/main/docs/ci-review-automation.md
          git config core.hooksPath /dev/null

      - name: Create working branch
        if: env.IS_PR_RUN != 'true'
        run: |
          git branch -D test-drift-fix-${DATESTAMP} 2>/dev/null || true
          git checkout -b test-drift-fix-${DATESTAMP}

      # The claude-code pool ships python3, python3-venv and docker
      # (the runner is in the docker group) and grants passwordless
      # sudo for nothing but its own cleanup script, so system packages
      # belong in the runner image (mach33labs/33fl) rather than here.
      # tox and pre-commit are the two things the steps below need that
      # the image does not carry, and both install into a venv.
      #
      # The venv goes in runner.temp, not $HOME: this pool is
      # long-lived and shared with every other repository's jobs, so a
      # venv in $HOME would be found again by an unrelated run.
      - name: Install dependencies
        run: |
          python3 -mvenv ${{ runner.temp }}/venv
          ${{ runner.temp }}/venv/bin/pip3 install -q tox pre-commit

      - name: Run initial tests
        id: initial_test
        continue-on-error: true
        run: |
          # The unit suite, which needs no root. The functional
          # suite in deploy/occystrap_ci/ mounts overlays and runs
          # runc, so it needs both root and a test registry and stays
          # on the vm runners in functional-tests.yml -- this pool has
          # neither. A functional failure is therefore not something
          # this lane can reproduce, let alone fix.
          set +e
          ${{ runner.temp }}/venv/bin/tox -epy3 \
            2>&1 | tee ${{ runner.temp }}/test-output.txt
          test_exit_code=${PIPESTATUS[0]}
          set -e

          if [ ${test_exit_code} -eq 0 ]; then
            echo "tests_passed=true" >> $GITHUB_OUTPUT
          else
            echo "tests_passed=false" >> $GITHUB_OUTPUT
          fi

          exit ${test_exit_code}

      - name: Exit early if nothing to do
        if: steps.initial_test.outputs.tests_passed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "All tests pass. Nothing to do."
          if [ "${IS_PR_RUN}" == "true" ]; then
            gh pr comment ${PR_NUMBER} \
              --repo ${{ github.repository }} \
              --body "All tests pass! No fixes needed."
          fi
          exit 0

      - name: Prepare Claude prompt
        if: steps.initial_test.outputs.tests_passed == 'false'
        run: |
          cat > ${{ runner.temp }}/claude-prompt.txt << 'PROMPT_EOF'
          The occystrap unit test suite has failures. Please analyze
          and fix them.

          ## Context

          occystrap is a Docker/OCI container image processing tool.
          Read AGENTS.md and ARCHITECTURE.md to understand the project
          structure. ARCHITECTURE.md is a summary and an index into
          docs/ -- for detail, read docs/pipeline.md and
          docs/internals.md.

          ## Test Failures

          The following tests failed. Analyze the output and fix the
          issues:

          PROMPT_EOF

          cat ${{ runner.temp }}/test-output.txt \
            >> ${{ runner.temp }}/claude-prompt.txt

          cat >> ${{ runner.temp }}/claude-prompt.txt << 'PROMPT_EOF'

          ## Your Task

          1. Diagnose what's causing the test failures
          2. Fix the occystrap code if needed (in occystrap/)
          3. Check formatting:
             ```bash
             ${{ runner.temp }}/venv/bin/pre-commit run --all-files
             ```
          4. Run the tests again to verify fixes:
             ```bash
             ${{ runner.temp }}/venv/bin/tox -epy3
             ```
          5. Stage all changes with git add (do NOT commit)
          6. Output a commit summary (see below)

          ## REQUIRED: Commit Summary Output

          After completing your work and staging changes, you MUST
          output a commit summary in the following exact format:

          ```
          COMMIT_SUMMARY_START
          <First line: 50 chars max, imperative mood, ends with period.>

          <Body: Wrap at 72 chars. Explain WHAT changed and WHY.>
          COMMIT_SUMMARY_END
          ```

          ## Important Notes

          - This is a Python project using tox for testing
          - Unit tests are in occystrap/tests/
          - The functional tests in deploy/occystrap_ci/ cannot run
            here: they need root and a local registry, and this runner
            has neither. Do not try to run them, and do not change
            them to work around their absence
          - Do NOT modify test expectations unless the old behavior
            was genuinely wrong
          PROMPT_EOF

          echo "Prompt prepared:"
          cat ${{ runner.temp }}/claude-prompt.txt

      - name: Run Claude Code to fix issues
        id: claude_fix
        if: steps.initial_test.outputs.tests_passed == 'false'
        continue-on-error: true
        run: |
          if ! command -v claude &> /dev/null; then
            echo "claude_available=false" >> $GITHUB_OUTPUT
            echo "Error: Claude Code CLI not found"
            exit 1
          fi

          echo "claude_available=true" >> $GITHUB_OUTPUT

          start_time=$(date +%s)

          claude -p "$(cat ${{ runner.temp }}/claude-prompt.txt)" \
            --dangerously-skip-permissions \
            --max-turns ${{ inputs.max_turns || '50' }} \
            --output-format text \
            2>&1 | tee ${{ runner.temp }}/claude-output.txt \
            || true

          mkdir -p ${{ runner.temp }}/claude-logs
          find ~/.claude/projects -name "*.jsonl" \
            -newermt "@${start_time}" \
            -exec cp {} ${{ runner.temp }}/claude-logs/ \; \
            2>/dev/null || true

          echo "=== Git Status ===" \
            > ${{ runner.temp }}/claude-changes.txt
          git status \
            >> ${{ runner.temp }}/claude-changes.txt 2>&1
          echo "" >> ${{ runner.temp }}/claude-changes.txt
          echo "=== Staged Changes ===" \
            >> ${{ runner.temp }}/claude-changes.txt
          git diff --cached \
            >> ${{ runner.temp }}/claude-changes.txt 2>&1

      - name: Extract commit summary
        id: extract_summary
        if: steps.claude_fix.outputs.claude_available == 'true'
        run: |
          if grep -q "COMMIT_SUMMARY_START" \
              ${{ runner.temp }}/claude-output.txt
          then
            sed -n '/COMMIT_SUMMARY_START/,/COMMIT_SUMMARY_END/p' \
              ${{ runner.temp }}/claude-output.txt | \
              grep -v "COMMIT_SUMMARY_START" | \
              grep -v "COMMIT_SUMMARY_END" | \
              sed 's/^```$//' | \
              sed '/^$/N;/^\n$/d' \
              > ${{ runner.temp }}/commit-summary.txt

            if [ -s ${{ runner.temp }}/commit-summary.txt ]; then
              echo "summary_found=true" >> $GITHUB_OUTPUT
              echo "Extracted commit summary:"
              cat ${{ runner.temp }}/commit-summary.txt
            else
              echo "summary_found=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "summary_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Verify fixes
        id: verify
        if: steps.claude_fix.outputs.claude_available == 'true'
        continue-on-error: true
        run: |
          # The same command as the initial test step above.
          set +e
          ${{ runner.temp }}/venv/bin/tox -epy3 \
            2>&1 | tee ${{ runner.temp }}/verify-output.txt
          verify_exit_code=${PIPESTATUS[0]}
          set -e

          if [ ${verify_exit_code} -eq 0 ]; then
            echo "fix_succeeded=true" >> $GITHUB_OUTPUT
          else
            echo "fix_succeeded=false" >> $GITHUB_OUTPUT
          fi

          exit ${verify_exit_code}

      - name: Commit changes
        if: |
          steps.verify.outputs.fix_succeeded == 'true' &&
          inputs.dry_run != true
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add -A

            if [ "${{ steps.extract_summary.outputs.summary_found }}" == "true" ] && \
               [ -s ${{ runner.temp }}/commit-summary.txt ]; then
              {
                cat ${{ runner.temp }}/commit-summary.txt
                echo ""
                if [ "${IS_PR_RUN}" == "true" ]; then
                  echo "Triggered-By: @shakenfist-bot please attempt to fix on PR #${PR_NUMBER}"
                fi
                echo ""
                echo "Signed-off-by: Michael Still <mikal@stillhq.com>"
                echo "Assisted-By: Claude Code"
                echo "Co-Authored-By: Claude Opus 4.6 <noreply@anthropic.com>"
              } > ${{ runner.temp }}/commit-message.txt

              git commit -F ${{ runner.temp }}/commit-message.txt
            else
              if [ "${IS_PR_RUN}" == "true" ]; then
                git commit -m "$(cat <<EOF
          Fix test failures on PR #${PR_NUMBER}.

          Claude Code automatically fixed test failures.

          Triggered-By: @shakenfist-bot please attempt to fix on PR #${PR_NUMBER}

          Signed-off-by: Michael Still <mikal@stillhq.com>
          Assisted-By: Claude Code
          Co-Authored-By: Claude Opus 4.6 <noreply@anthropic.com>
          EOF
          )"
              else
                git commit -m "$(cat <<EOF
          Fix test suite drift for ${DATESTAMP}.

          Claude Code automatically fixed test failures.

          Signed-off-by: Michael Still <mikal@stillhq.com>
          Assisted-By: Claude Code
          Co-Authored-By: Claude Opus 4.6 <noreply@anthropic.com>
          EOF
          )"
              fi
            fi
          fi

      - name: Push changes (PR mode)
        if: |
          env.IS_PR_RUN == 'true' &&
          steps.verify.outputs.fix_succeeded == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin ${PR_REF}

          gh pr comment ${PR_NUMBER} \
            --repo ${{ github.repository }} \
            --body "Claude Code fixed the test failures and pushed the changes.

          Please review the new commits."

      - name: Push and create PR (scheduled/manual mode)
        if: |
          env.IS_PR_RUN != 'true' &&
          steps.verify.outputs.fix_succeeded == 'true' &&
          inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push -f origin test-drift-fix-${DATESTAMP}
          sleep 5

          if [ "${{ steps.extract_summary.outputs.summary_found }}" == "true" ] && \
             [ -s ${{ runner.temp }}/commit-summary.txt ]; then
            PR_TITLE=$(head -1 \
              ${{ runner.temp }}/commit-summary.txt | \
              sed 's/\.$//')
            COMMIT_BODY=$(tail -n +3 \
              ${{ runner.temp }}/commit-summary.txt)
          else
            PR_TITLE="Fix test suite drift (${DATESTAMP})"
            COMMIT_BODY="Claude Code automatically fixed test failures."
          fi

          gh pr create \
            --assignee mikalstill \
            --reviewer mikalstill \
            --title "${PR_TITLE}" \
            --body "$(cat <<EOF
          ## Summary

          ${COMMIT_BODY}

          ## Changes

          $(git diff --stat HEAD~1)

          ## Verification

          All tests pass after these changes.

          ---
          Generated with [Claude Code](https://claude.com/claude-code)
          EOF
          )" \
            --head $(git branch --show-current)

      - name: Report failure (PR mode)
        if: |
          env.IS_PR_RUN == 'true' &&
          steps.initial_test.outputs.tests_passed == 'false' &&
          (steps.claude_fix.outputs.claude_available != 'true' ||
           steps.verify.outputs.fix_succeeded == 'false')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TEST_OUTPUT=$(tail -c 2000 \
            ${{ runner.temp }}/test-output.txt \
            2>/dev/null || echo "See workflow logs for details.")

          gh pr comment ${PR_NUMBER} \
            --repo ${{ github.repository }} \
            --body "Claude Code was unable to fix the test failures automatically.

          [View workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

          **Last 2KB of test output:**
          \`\`\`
          ${TEST_OUTPUT}
          \`\`\`"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.pr_number != '' && format('pr-fix-logs-{0}', inputs.pr_number) || format('test-drift-fix-logs-{0}', github.run_id) }}
          path: |
            ${{ runner.temp }}/test-output.txt
            ${{ runner.temp }}/verify-output.txt
            ${{ runner.temp }}/claude-output.txt
            ${{ runner.temp }}/claude-prompt.txt
            ${{ runner.temp }}/claude-changes.txt
            ${{ runner.temp }}/commit-summary.txt
            ${{ runner.temp }}/commit-message.txt
            ${{ runner.temp }}/claude-logs/
          retention-days: 14
